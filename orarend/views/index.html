<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Órarend</title>
  <style>
    body { font-family: sans-serif; background: #f9f9f9; margin: 0; padding: 20px; }
    h1 { text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; margin-bottom: 30px; }
    .day-column { background: #fff; border-radius: 10px; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .day-column h2 { margin-top: 0; font-size: 1.2em; }
    .lesson { display: flex; justify-content: space-between; align-items: center; background: #f1f1f1; padding: 5px 10px; margin: 5px 0; border-radius: 5px; cursor: pointer; }
    .lesson span { flex: 1; }
    .lesson button { background: none; border: none; color: red; font-weight: bold; cursor: pointer; }
    .form { display: flex; gap: 10px; align-items: center; background: #fff; padding: 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    select, input { padding: 5px; border-radius: 5px; border: 1px solid #ccc; }
    button.add, button.save { background: #007BFF; color: white; border: none; padding: 7px 15px; border-radius: 5px; cursor: pointer; }
    button.add:hover, button.save:hover { background: #0056b3; }
    .edit-form { margin-top: 10px; display: flex; gap: 5px; }
  </style>
</head>
<body>

<h1>Órarend</h1>

<div class="grid" id="schedule-grid"></div>

<div class="form">
  <select id="day-select">
    <option value="Hétfő">Hétfő</option>
    <option value="Kedd">Kedd</option>
    <option value="Szerda">Szerda</option>
    <option value="Csütörtök">Csütörtök</option>
    <option value="Péntek">Péntek</option>
  </select>
  <input type="number" id="hour-input" min="1" placeholder="Óra (pl. 1)" />
  <input type="text" id="subject-input" placeholder="Tantárgy" />
  <button class="add" onclick="addLesson()">Hozzáad</button>
</div>

<div class="grid" id="schedule-grid"></div>

</body>
</html>
